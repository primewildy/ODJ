[package]
name = "dj"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dj"
path = "src/main.rs"

[dependencies]
audio = { path = "crates/audio" }
decode = { path = "crates/decode" }
control = { path = "crates/control" }
ui = { path = "crates/ui" }
clap = { workspace = true }
anyhow = { workspace = true }
midir = { workspace = true }
eframe = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[workspace]
resolver = "2"
members = ["crates/audio", "crates/decode", "crates/control", "crates/ui", "crates/analysis", "crates/stems"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
cpal = "0.15"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "flac", "aac", "isomp4"] }
rtrb = "0.3"
crossterm = "0.27"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
midir = "0.10"
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = "0.28"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# ONNX Runtime bindings — used by the analysis crate for beat_this
# downbeat inference on the GPU. download-binaries pulls a prebuilt
# libonnxruntime (with the CUDA EP linked) at build time; the `cuda`
# feature wires up the runtime path to actually use it. Pinned to
# rc.9 because rc.10+ ship an ort-sys build script that's broken
# against newer ureq (`tls_config` no longer exists).
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["download-binaries", "copy-dylibs", "ndarray", "cuda", "tensorrt"] }
ort-sys = { version = "=2.0.0-rc.9" }
ndarray = "0.16"
# Used by the UI worker thread to nice itself down so GPU analysis
# doesn't starve the audio callback thread.
libc = "0.2"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
